# Traefik v3 static configuration of the prod-like stack (docker-compose.prod.yml).
# Spec sections 5.1 and 9.1: path routing, TLS, rate limiting, and no exposure of /internal/*.
# Routing rules live in dynamic/antre.yml. In k3s the same rules are IngressRoutes (infra/k8s).
global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO
  format: json

accessLog:
  format: json
  # Query strings carry phone numbers and JWTs (EventSource and the kiosk cannot set headers:
  # /stream?access_token=..., /kiosk.html?token=...). Traefik puts the query into RequestPath and
  # RequestLine, and has no path-without-query field, so both are dropped; the router and service
  # names still say which route was hit.
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
    names:
      QueryString: drop
      RequestPath: drop
      RequestLine: drop

entryPoints:
  # Plain HTTP for local use. In production terminate TLS at the edge/websecure only and drop this
  # entry point or turn it into a redirect (see README, Deploy).
  web:
    address: ':8000'
    transport:
      respondingTimeouts:
        readTimeout: 30s
        # 0 = no write deadline, required for long-lived SSE streams (REALTIME_MAX_STREAM_SECONDS).
        writeTimeout: 0s
        idleTimeout: 180s
  # TLS entry point. Without a certificate configured, Traefik serves its built-in self-signed
  # default certificate (local use). Production: configure an ACME certificatesResolver (README).
  websecure:
    address: ':8443'
    http:
      tls: {}
    transport:
      respondingTimeouts:
        readTimeout: 30s
        writeTimeout: 0s
        idleTimeout: 180s
  # Health ping only; never published to the host.
  traefik:
    address: ':8082'

ping:
  entryPoint: traefik

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: false

# No dashboard or API: the gateway exposes nothing but the routes in dynamic/antre.yml.
api:
  dashboard: false
  insecure: false

# Prometheus metrics on the internal `traefik` entry point (:8082, never published to the host);
# scraped by the observability overlay (docker-compose.observability.yml). Service labels only.
metrics:
  prometheus:
    entryPoint: traefik
    addEntryPointsLabels: false
    addRoutersLabels: false
    addServicesLabels: true
    buckets: [0.01, 0.025, 0.05, 0.1, 0.2, 0.3, 0.5, 1, 2.5, 5]
