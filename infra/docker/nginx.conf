# Static web-staff (staff dashboard + Kiosk TV) behind the Traefik gateway.
# Runs as the unprivileged nginx user (uid 101) on port 8080; TLS and security headers live at the gateway.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # The unprivileged image writes temp files under /tmp so the root filesystem can be read-only.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    root /usr/share/nginx/html;

    location = /healthz {
      default_type text/plain;
      return 200 'ok';
    }

    # Vite emits content-hashed files under /assets, so they can be cached for a year.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # index.html and kiosk.html must always be revalidated to pick up new hashed assets. The staff
    # app uses a hash router, so there is no SPA fallback: unknown paths (including /api and
    # /internal, which never belong to this server) answer 404.
    location / {
      index index.html;
      add_header Cache-Control "no-cache";
      try_files $uri $uri/ =404;
    }
  }
}
