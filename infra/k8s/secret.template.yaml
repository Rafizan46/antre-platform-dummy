# TEMPLATE, not applied by kustomize. Copy it OUTSIDE the repository, replace every CHANGE_ME, and
# apply it before the first rollout:   kubectl apply -f antre-secrets.yaml
# Or create the Secret from a file:    kubectl -n antre create secret generic antre-secrets --from-env-file=secrets.env
# Never commit the filled-in file. Required secrets must not start with "dev-only" (production
# refuses them). JWT_SECRET, WA_CHANNEL_SERVICE_TOKEN, PAYMENT_CALLBACK_SECRET: >= 32 characters;
# WA_APP_SECRET, WA_VERIFY_TOKEN: >= 16. Generate with `openssl rand -hex 32`.
apiVersion: v1
kind: Secret
metadata:
  name: antre-secrets
  namespace: antre
type: Opaque
stringData:
  JWT_SECRET: CHANGE_ME
  WA_CHANNEL_SERVICE_TOKEN: CHANGE_ME
  PAYMENT_CALLBACK_SECRET: CHANGE_ME
  WA_APP_SECRET: CHANGE_ME
  WA_VERIFY_TOKEN: CHANGE_ME
  # Connection URLs of the managed services (URL-encode special characters in passwords).
  DATABASE_APP_URL: postgres://antre_app:CHANGE_ME@postgres.example.internal:5432/antre?sslmode=require
  DATABASE_PLATFORM_ADMIN_URL: postgres://antre_platform_admin:CHANGE_ME@postgres.example.internal:5432/antre?sslmode=require
  DATABASE_MIGRATOR_URL: postgres://antre_migrator:CHANGE_ME@postgres.example.internal:5432/antre?sslmode=require
  REDIS_URL: rediss://:CHANGE_ME@redis.example.internal:6379
  RABBITMQ_URL: amqps://antre:CHANGE_ME@rabbitmq.example.internal:5671
  # Only for WA_ADAPTER=meta; keep the key (empty) otherwise.
  META_WA_ACCESS_TOKEN: ''
