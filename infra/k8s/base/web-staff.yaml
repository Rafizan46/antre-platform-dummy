apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-staff
  labels:
    app.kubernetes.io/name: web-staff
spec:
  # replicas is owned by the HorizontalPodAutoscaler below.
  selector:
    matchLabels:
      app.kubernetes.io/name: web-staff
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-staff
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: web-staff
      containers:
        - name: web-staff
          image: antre/web-staff:dev
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web-staff
  labels:
    app.kubernetes.io/name: web-staff
spec:
  selector:
    app.kubernetes.io/name: web-staff
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# NFR-SCAL-01: scale out at 70% average CPU per pod, 1 to 4 replicas. The req/s criterion
# (> 50 req/s per pod, Prometheus Adapter) and the notifications.wa queue-length criterion
# (> 100 messages per pod, KEDA or an external-metrics adapter) need components this repo does
# not install; they are an MVP limitation (README, Deploy).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-staff
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web-staff
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web-staff
spec:
  # With one replica this still lets a node drain (runbook, README); with two or more replicas at
  # most one is taken down voluntarily at a time.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web-staff
