# Observability overlay (spec section 9.2): Prometheus + Grafana (+ redis_exporter) on top of the
# prod-like stack. RabbitMQ (rabbitmq_prometheus, default in the image) and Traefik (internal
# entry point :8082) already expose metrics; the four services expose /metrics themselves.
#
#   docker compose --env-file .env.prod -f docker-compose.prod.yml -f docker-compose.observability.yml up -d --wait
#
# Grafana:    http://127.0.0.1:13000  (user admin, password GRAFANA_ADMIN_PASSWORD)
# Prometheus: http://127.0.0.1:19090
# Both bind to 127.0.0.1 only. Nothing here is reachable through the Traefik gateway.
x-observability-defaults: &observability-defaults
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

services:
  prometheus:
    <<: *observability-defaults
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-19090}:9090'
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yml:/etc/prometheus/rules/alerts.yml:ro
      - prometheus-data:/prometheus
    # edge reaches Traefik and the app services, data reaches RabbitMQ and the Redis exporter.
    networks: [edge, data]
    depends_on:
      gateway: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:9090/-/ready']
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    <<: *observability-defaults
    image: grafana/grafana:13.0.11@sha256:2abd2114bb65e4d6f0614206b7c882c1e7c6a992827ba08396aa5afc23ca07f5
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/antre-overview.json
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-13000}:3000'
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [edge]
    depends_on:
      prometheus: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:3000/api/health | grep -q ok']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis-exporter:
    <<: *observability-defaults
    image: oliver006/redis_exporter:v1.94.0@sha256:0842ef7110e62b40bbde2d5c11f38c6fbd99f7100c75e3866637c1b335a1eff7
    read_only: true
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    networks: [data]
    depends_on:
      redis: { condition: service_healthy }

volumes:
  prometheus-data:
  grafana-data:
