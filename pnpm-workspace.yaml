packages:
  - 'apps/*'
  # apps/gateway holds Traefik configuration, not a Node package.
  - '!apps/gateway'
  - 'packages/*'

# Exact versions shared by every workspace package ("catalog:" in package.json).
catalog:
  '@eslint/js': 10.0.1
  '@types/node': 22.20.5
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': 6.1.2
  eslint: 10.12.0
  eslint-config-prettier: 10.1.8
  fastify: 5.12.7
  prettier: 3.9.10
  react: 19.3.1
  react-dom: 19.3.1
  # typescript-eslint 8.71.2 supports typescript >=4.8.4 <6.1.0, so TypeScript 7 is not used yet.
  typescript: 6.0.3
  typescript-eslint: 8.71.2
  vite: 8.3.4
  vitest: 5.0.5

# fsevents (macOS-only optional dependency of vite) ships a prebuilt binary; its build script is not needed.
allowBuilds:
  fsevents: false
